<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1010" viewBox="0 0 1600 1010" role="img" aria-labelledby="title desc">
<title id="title">BiteWise navigatie en screen flow</title><desc id="desc">Vijf vaste tabs: Dagboek, Eten, Inzicht, Gezondheid en Meer. De dagboekmaaltijd opent dezelfde Eten-hub die via de tab bereikbaar is, en alle invoermethoden leiden naar portiecontrole voordat voeding aan het dagboek wordt toegevoegd. Meer bevat doelen, vrienden, AI, herinneringen en instellingen. Gezondheid toont bron en actualiteit en leidt naar koppelingen onder instellingen.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08130e"/><stop offset="1" stop-color="#13291d"/></linearGradient><linearGradient id="glass" x2="1" y2="1"><stop stop-color="#345240" stop-opacity=".8"/><stop offset="1" stop-color="#1b3526" stop-opacity=".94"/></linearGradient><filter id="shadow" x="-30%" y="-40%" width="160%" height="180%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".24"/></filter><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#75cfa0" stroke-width="1.5"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#eef8f0} .muted{fill:#abc1b0;font-size:16px}.title{font-size:35px;font-weight:700;letter-spacing:-.5px}.sub{font-size:17px}.tab{font-size:22px;font-weight:700}.tiny{font-size:15px;fill:#cbdcd0}.node{font-size:17px;font-weight:650}.section{font-size:19px;font-weight:700;fill:#75e5a3}.accent{fill:#47e48c}.line{stroke:#75cfa0;stroke-width:2;fill:none;marker-end:url(#arrow)}.soft{stroke:#5d8e6f;stroke-width:2;fill:none}.box{fill:#182d21;stroke:#4a7055;stroke-width:1.5}.box-accent{fill:#204832;stroke:#64cf8f;stroke-width:2}</style>
